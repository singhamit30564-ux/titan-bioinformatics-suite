[browser]
gatherUsageStats = false

[server]
headless = true
address = "0.0.0.0"
port = 8501
# Serves ./static/* at /app/static/* — used by the opt-in PWA shell
# (manifest.json, service worker, icons). Pure addition: no existing route
# or page depends on this flag, so disabling it only turns off PWA extras.
enableStaticServing = true

[theme]
base = "dark"
primaryColor = "#d4af37"
backgroundColor = "#0a0e17"
secondaryBackgroundColor = "#1a1f2e"
textColor = "#e0e0e0"
font = "sans serif"

[logger]
level = "warning"
