name: CI — Titan Bioinformatics Suite

on:
  push:
    branches: [main, arena/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pyflakes biopython pandas plotly
      - name: Compile pages
        run: python -m py_compile pages/*.py Home.py titan_utils/*.py
      - name: Unit tests — utils, shared helpers, page regressions
        run: pytest tests/test_titan_suite.py tests/test_ui_helpers.py -v
      - name: Interaction tests — every page renders and every button works
        run: pytest tests/test_page_interactions.py -v
